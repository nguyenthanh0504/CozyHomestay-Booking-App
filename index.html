<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Your Stay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #132225;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1a2e31 0%, #132225 55%);
    --surface: #1B3236;
    --surface-raised: #20393e;
    --card: #FBF7ED;
    --ink: #ECE6D6;
    --ink-dim: #9FB3AE;
    --line: #2E4B4E;
    --brass: #CC9F4C;
    --brass-soft: rgba(204,159,76,0.16);
    --danger: #D9694F;
    --ok: #6DBE9C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'Inter', system-ui, sans-serif; background: var(--bg-grad); color: var(--ink);
    min-height: 100vh; padding: 32px 20px 60px;
  }
  .hb-shell { max-width: 760px; margin: 0 auto; }

  .hb-header { margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .hb-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); margin: 0 0 10px; }
  .hb-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 36px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .hb-subtitle { color: var(--ink-dim); font-size: 14.5px; margin: 0; max-width: 560px; }

  .hb-lang-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .hb-lang-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; padding: 8px 16px; border: none; background: transparent; color: var(--ink-dim); cursor: pointer; }
  .hb-lang-btn.active { background: var(--brass); color: #23190A; }

  .hb-rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .hb-tag { position: relative; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .hb-tag-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .hb-tag-name { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .hb-tag-line { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
  .hb-tag-price { font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--tag-accent); text-align: right; }
  .hb-tag-price .hb-price-secondary { display: block; font-size: 11px; color: var(--ink-dim); font-weight: 400; margin-top: 3px; }
  .hb-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 6px 10px; border-radius: 999px; background: var(--tag-accent-soft); color: var(--tag-accent); font-weight: 600; }
  .hb-status.occupied { background: rgba(217,105,79,0.16); color: var(--danger); }
  .hb-amenities { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .hb-amenity-chip { font-size: 11px; color: var(--ink-dim); background: rgba(255,255,255,0.04); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }

  .hb-panel { background: var(--card); color: #241F14; border-radius: 18px; padding: 26px 26px 22px; margin-bottom: 20px; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5); }
  .hb-panel-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .hb-panel-sub { color: #6B6350; font-size: 13px; margin: 0 0 20px; }

  .hb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .hb-grid .span-2 { grid-column: span 2; }
  .hb-field { display: flex; flex-direction: column; gap: 6px; }
  .hb-field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #7A7259; }
  .hb-field label .hb-label-note { text-transform: none; font-weight: 400; }
  .hb-field input, .hb-field select {
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; border-radius: 9px;
    border: 1.5px solid #E1D9C0; background: #FFFDF7; color: #241F14; outline: none; width: 100%;
  }
  .hb-field input:focus, .hb-field select:focus { border-color: var(--brass); }
  .hb-field-hint { font-size: 12px; color: #8A806A; margin: 2px 0 0; }

  .hb-room-choice { display: flex; gap: 8px; }
  .hb-room-btn {
    flex: 1; padding: 10px 8px; border-radius: 9px; border: 1.5px solid #E1D9C0; background: #FFFDF7;
    font-size: 13px; font-weight: 600; cursor: pointer; color: #4C4636; font-family: 'Inter', sans-serif; line-height: 1.4;
  }
  .hb-room-btn small { display: block; font-size: 11px; font-weight: 400; opacity: 0.8; }
  .hb-room-btn.active { border-color: var(--room-accent); background: var(--room-accent-soft); color: var(--room-accent); }

  .hb-social-row { display: flex; gap: 8px; }
  .hb-social-row select { flex: 0 0 168px; font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 10px; border-radius: 9px; border: 1.5px solid #E1D9C0; background: #FFFDF7; color: #241F14; outline: none; }
  .hb-social-row input { flex: 1; font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; border-radius: 9px; border: 1.5px solid #E1D9C0; background: #FFFDF7; color: #241F14; outline: none; }
  .hb-social-row input:disabled { background: #F0EBDA; color: #A69C82; cursor: not-allowed; }

  .hb-preview { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: #F3EDD9; display: flex; flex-wrap: wrap; gap: 22px; align-items: center; font-size: 13.5px; }
  .hb-preview strong { font-family: 'IBM Plex Mono', monospace; }
  .hb-preview .hb-price-secondary { display: block; font-size: 11px; color: #8A806A; }
  .hb-preview .discount-pill { background: var(--ok); color: #0E2A20; font-weight: 700; font-size: 11px; padding: 3px 9px; border-radius: 999px; }

  .hb-error { margin-top: 14px; background: rgba(217,105,79,0.12); border: 1px solid rgba(217,105,79,0.4); color: #A83F26; padding: 10px 14px; border-radius: 10px; font-size: 13px; }

  .hb-actions { display: flex; gap: 10px; margin-top: 20px; }
  .hb-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; padding: 12px 22px; border-radius: 9px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .hb-btn:active { transform: scale(0.98); }
  .hb-btn-primary { background: #1F3330; color: #EFE9D4; width: 100%; justify-content: center; }
  .hb-btn-ghost { background: transparent; color: #6B6350; border: 1.5px solid #E1D9C0; }

  .hb-sync-banner { background: rgba(217,105,79,0.12); border: 1px solid rgba(217,105,79,0.4); color: #E39B87; padding: 10px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; align-items: center; }

  .hb-confirm { text-align: center; padding: 20px 10px; }
  .hb-confirm-icon { font-size: 40px; margin-bottom: 10px; }
  .hb-confirm-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; margin: 0 0 8px; }
  .hb-confirm-sub { color: #6B6350; font-size: 14px; margin: 0 0 20px; }
  .hb-confirm-card { background: #F3EDD9; border-radius: 12px; padding: 18px 20px; text-align: left; margin-bottom: 20px; }
  .hb-confirm-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; }
  .hb-confirm-row span:first-child { color: #8A806A; }
  .hb-confirm-ref { font-family: 'IBM Plex Mono', monospace; font-weight: 700; letter-spacing: 0.04em; }

  .hb-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hb-result { margin-top: 16px; background: #F3EDD9; border-radius: 12px; padding: 16px 18px; font-size: 14px; }
  .hb-result-status { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .hb-result.notfound { background: rgba(217,105,79,0.12); color: #A83F26; }
  .hb-note { margin-top: 18px; font-size: 12.5px; color: var(--ink-dim); text-align: center; }

  @media (max-width: 640px) {
    .hb-rooms { grid-template-columns: 1fr; }
    .hb-grid { grid-template-columns: 1fr 1fr; }
    .hb-title { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="hb-shell">
  <div class="hb-header">
    <div>
      <p class="hb-eyebrow" id="t-eyebrow"></p>
      <h1 class="hb-title" id="t-title"></h1>
      <p class="hb-subtitle" id="t-subtitle"></p>
    </div>
    <div class="hb-lang-toggle">
      <button type="button" class="hb-lang-btn" id="lang-en" data-lang="en">EN</button>
      <button type="button" class="hb-lang-btn" id="lang-vi" data-lang="vi">VI</button>
    </div>
  </div>

  <div class="hb-rooms" id="hb-rooms"></div>

  <div id="hb-sync-banner" class="hb-sync-banner" style="display:none;"></div>

  <form class="hb-panel" id="hb-form">
    <h2 class="hb-panel-title" id="t-panelTitle"></h2>
    <p class="hb-panel-sub" id="t-panelSub"></p>

    <div class="hb-grid">
      <div class="hb-field span-2">
        <label id="t-labelGuestName"></label>
        <input type="text" id="f-guestName" />
      </div>
      <div class="hb-field">
        <label id="t-labelPhone"></label>
        <input type="tel" id="f-phone" />
      </div>
      <div class="hb-field">
        <label id="t-labelCountry"></label>
        <input type="text" id="f-country" />
      </div>

      <div class="hb-field" style="grid-column: span 4;">
        <label><span id="t-labelSocial"></span> <span class="hb-label-note" id="t-labelSocialHint"></span></label>
        <div class="hb-social-row">
          <select id="f-socialMethod">
            <option value="" id="opt-social-none"></option>
            <option value="zalo">Zalo</option>
            <option value="instagram">Instagram</option>
            <option value="messenger">Facebook Messenger</option>
          </select>
          <input type="text" id="f-socialHandle" disabled />
        </div>
      </div>

      <div class="hb-field span-2">
        <label id="t-labelRoom"></label>
        <div class="hb-room-choice" id="hb-room-choice"></div>
      </div>
      <div class="hb-field">
        <label id="t-labelGuests"></label>
        <input type="number" id="f-guests" min="1" value="1" />
      </div>
      <div class="hb-field"></div>

      <div class="hb-field">
        <label id="t-labelCheckIn"></label>
        <input type="date" id="f-checkIn" />
        <p class="hb-field-hint" id="t-hintCheckIn"></p>
      </div>
      <div class="hb-field">
        <label id="t-labelCheckOut"></label>
        <input type="date" id="f-checkOut" />
        <p class="hb-field-hint" id="t-hintCheckOut"></p>
      </div>
      <div class="hb-field span-2"></div>
    </div>

    <div class="hb-preview" id="hb-preview" style="display:none;"></div>
    <div class="hb-error" id="hb-error" style="display:none;"></div>

    <div class="hb-actions">
      <button type="submit" class="hb-btn hb-btn-primary" id="hb-submit-btn"></button>
    </div>
  </form>

  <div class="hb-panel hb-confirm" id="hb-confirm" style="display:none;">
    <div class="hb-confirm-icon">🎉</div>
    <h2 class="hb-confirm-title" id="t-confirmTitle"></h2>
    <p class="hb-confirm-sub" id="t-confirmSub"></p>
    <div class="hb-confirm-card" id="hb-confirm-card"></div>
    <p class="hb-confirm-sub" id="t-confirmHowTo" style="font-size:13px;"></p>
    <button type="button" class="hb-btn hb-btn-ghost" id="hb-new-booking-btn" style="width:100%;justify-content:center;"></button>
  </div>

  <form class="hb-panel" id="hb-check-form">
    <h2 class="hb-panel-title" id="t-checkTitle"></h2>
    <p class="hb-panel-sub" id="t-checkSub"></p>
    <div class="hb-field-row">
      <div class="hb-field">
        <label id="t-labelRef"></label>
        <input type="text" id="c-ref" autocomplete="off" />
      </div>
      <div class="hb-field">
        <label id="t-labelContact"></label>
        <input type="text" id="c-contact" autocomplete="off" />
      </div>
    </div>
    <div class="hb-actions"><button type="submit" class="hb-btn hb-btn-primary" id="hb-check-btn"></button></div>
    <div id="hb-check-result"></div>
  </form>

  <p class="hb-note" id="t-footerNote"></p>
</div>

      accent: '#D98255', accentSoft: 'rgba(217,130,85,0.16)',
      amenityKeys: ['wifi', 'guestsCozy', 'bedCozy', 'tv', 'kitchen', 'laundry', 'fridge', 'elevator'],
      icons: { wifi: '📶', guestsCozy: '👥', bedCozy: '🛏️', tv: '📺', kitchen: '🍳', laundry: '🧺', fridge: '🧊', elevator: '🛗' }
    },
    relaxation: {
      key: 'relaxation', name: 'Relaxation Suite', price: 80, priceVND: 1500000,
      accent: '#5FA98C', accentSoft: 'rgba(95,169,140,0.16)',
      amenityKeys: ['wifi', 'guestsRelax', 'bedRelax', 'tv', 'kitchen', 'laundry', 'fridge', 'elevator'],
      icons: { wifi: '📶', guestsRelax: '👥', bedRelax: '🛏️', tv: '📺', kitchen: '🍳', laundry: '🧺', fridge: '🧊', elevator: '🛗' }
    }
  };
  // ⬇️ PASTE the SAME Apps Script Web App URL you used in the front-desk app.
  // Using the same URL is what links the two apps — they read and write the same Sheet.
  const API_URL = 'https://script.google.com/macros/s/AKfycbycivsFuoSrHYar7f7QkdPu4XogNLKxgx4bEVZMmsraw2EsgyWc5-bxPNUNTZFjGXAk1g/exec';
  const DISCOUNT_THRESHOLD_NIGHTS = 5;
  const DISCOUNT_RATE = 0.1;
  const AUTO_REFRESH_MS = 20000;

  // ---------- Helpers ----------
  const todayStr = () => new Date().toISOString().slice(0, 10);
  const nightsBetween = (ci, co) => {
    if (!ci || !co) return 0;
    const a = new Date(ci + 'T00:00:00'), b = new Date(co + 'T00:00:00');
    const d = Math.round((b - a) / 86400000);
    return d > 0 ? d : 0;
  };
  const usd = (n) => n.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  const vnd = (n) => Math.round(n).toLocaleString('vi-VN') + ' ₫';
  const dualPrice = (usdAmt, vndAmt) => lang === 'vi'
    ? { primary: vnd(vndAmt), secondary: '≈ ' + usd(usdAmt) }
    : { primary: usd(usdAmt), secondary: '≈ ' + vnd(vndAmt) };
  const formatDate = (d) => {
    if (!d) return '—';
    return new Date(d + 'T00:00:00').toLocaleDateString(lang === 'vi' ? 'vi-VN' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  };
  const computePrice = (roomKey, nights) => {
    const room = ROOMS[roomKey];
    const baseUsd = room.price * nights, baseVnd = room.priceVND * nights;
    const discounted = nights > DISCOUNT_THRESHOLD_NIGHTS;
    const totalUsd = discounted ? baseUsd * (1 - DISCOUNT_RATE) : baseUsd;
    const totalVnd = discounted ? baseVnd * (1 - DISCOUNT_RATE) : baseVnd;
    return { discounted, totalUsd, totalVnd };
  };
  const uid = () => 'bk_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  const rangesOverlap = (aS, aE, bS, bE) => new Date(aS) < new Date(bE) && new Date(bS) < new Date(aE);
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // ---------- State ----------
  let bookings = [];
  let selectedRoom = 'cozy';
  let lastSyncError = '';
  const DATE_FIELDS = ['checkIn', 'checkOut'];

  function normalizeRow(row) {
    const r = { ...row };
    ['guests', 'nights', 'pricePerNight', 'pricePerNightVND', 'total', 'totalVND'].forEach((f) => { if (r[f] !== undefined && r[f] !== '') r[f] = Number(r[f]); });
    DATE_FIELDS.forEach((f) => { if (typeof r[f] === 'string' && r[f].length > 10) r[f] = r[f].slice(0, 10); });
    return r;
  }

  async function loadBookings() {
    if (API_URL.includes('PASTE_YOUR_WEB_APP_URL_HERE')) {
      lastSyncError = t('syncNotConnected');
      renderSyncBanner();
      return;
    }
    try {
      const res = await fetch(API_URL, { method: 'GET' });
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();
      bookings = data.map(normalizeRow);
      lastSyncError = '';
    } catch (e) {
      lastSyncError = t('syncError');
    } finally {
      renderSyncBanner();
      renderRooms();
    }
  }

  async function persistUpsert(record) {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'upsert', record })
    });
  }

  function renderSyncBanner() {
    const el = document.getElementById('hb-sync-banner');
    if (lastSyncError) { el.style.display = 'flex'; el.textContent = '⚠ ' + lastSyncError; }
    else { el.style.display = 'none'; }
  }

  // ---------- Room status (no guest names shown to customers) ----------
  function getRoomStatus() {
    const today = todayStr();
    const status = {};
    Object.keys(ROOMS).forEach((rk) => {
      const checkedIn = bookings.find((b) => b.roomKey === rk && b.status === 'checked-in');
      if (checkedIn) { status[rk] = { state: 'occupied', until: checkedIn.checkOut }; return; }
      const booked = bookings.find((b) => b.roomKey === rk && b.status !== 'checked-out' && b.status !== 'declined' && b.checkIn <= today && today < b.checkOut);
      if (booked) { status[rk] = { state: 'booked', until: booked.checkOut }; return; }
      status[rk] = { state: 'available' };
    });
    return status;
  }

  function renderRooms() {
    const status = getRoomStatus();
    const el = document.getElementById('hb-rooms');
    el.innerHTML = Object.values(ROOMS).map((room) => {
      const s = status[room.key];
      let statusHtml;
      if (s.state === 'occupied') statusHtml = `<span class="hb-status occupied">${t('statusOccupiedPrefix')}${formatDate(s.until)}</span>`;
      else if (s.state === 'booked') statusHtml = `<span class="hb-status" style="background:var(--brass-soft);color:var(--brass)">${t('statusBookedPrefix')}${formatDate(s.until)}</span>`;
      else statusHtml = `<span class="hb-status">${t('statusAvailable')}</span>`;
      const price = dualPrice(room.price, room.priceVND);
      const tagline = room.key === 'cozy' ? t('taglineCozy') : t('taglineRelax');
      const amenitiesHtml = room.amenityKeys.map((k) => `<span class="hb-amenity-chip">${room.icons[k]} ${t('amenity_' + k)}</span>`).join('');
      return `
        <div class="hb-tag" style="--tag-accent:${room.accent};--tag-accent-soft:${room.accentSoft}">
          <div class="hb-tag-top">
            <div><p class="hb-tag-name">${room.name}</p><p class="hb-tag-line">${tagline}</p></div>
            <div class="hb-tag-price">${price.primary} ${t('perNight')}<span class="hb-price-secondary">${price.secondary}</span></div>
          </div>
          ${statusHtml}
          <div class="hb-amenities">${amenitiesHtml}</div>
        </div>`;
    }).join('');
  }

  function renderRoomChoice() {
    const el = document.getElementById('hb-room-choice');
    el.innerHTML = Object.values(ROOMS).map((room) => {
      const price = dualPrice(room.price, room.priceVND);
      return `<button type="button" class="hb-room-btn ${selectedRoom === room.key ? 'active' : ''}"
        style="--room-accent:${room.accent};--room-accent-soft:${room.accentSoft}"
        data-room="${room.key}">${room.name}<small>${price.primary}</small></button>`;
    }).join('');
    el.querySelectorAll('.hb-room-btn').forEach((btn) => {
      btn.addEventListener('click', () => { selectedRoom = btn.dataset.room; renderRoomChoice(); updatePreview(); });
    });
  }

  function updatePreview() {
    const ci = document.getElementById('f-checkIn').value;
    const co = document.getElementById('f-checkOut').value;
    const nights = nightsBetween(ci, co);
    const previewEl = document.getElementById('hb-preview');
    if (nights <= 0) { previewEl.style.display = 'none'; return; }
    const { discounted, totalUsd, totalVnd } = computePrice(selectedRoom, nights);
    const price = dualPrice(totalUsd, totalVnd);
    previewEl.style.display = 'flex';
    previewEl.innerHTML = `
      <span>🌙 <strong>${nights}</strong></span>
      ${discounted ? `<span class="discount-pill">${t('discountPill')}</span>` : ''}
      <span>${t('total')}: <strong>${price.primary}</strong><span class="hb-price-secondary">${price.secondary}</span></span>
    `;
  }

  function applyStaticText() {
    document.getElementById('t-eyebrow').textContent = t('eyebrow');
    document.getElementById('t-title').textContent = t('title');
    document.getElementById('t-subtitle').innerHTML = t('subtitle');
    document.getElementById('t-panelTitle').textContent = t('panelTitle');
    document.getElementById('t-panelSub').textContent = t('panelSub');
    document.getElementById('t-labelGuestName').textContent = t('labelGuestName');
    document.getElementById('t-labelPhone').textContent = t('labelPhone');
    document.getElementById('t-labelCountry').textContent = t('labelCountry');
    document.getElementById('t-labelSocial').textContent = t('labelSocial');
    document.getElementById('t-labelSocialHint').textContent = t('labelSocialHint');
    document.getElementById('opt-social-none').textContent = t('socialNone');
    document.getElementById('t-labelRoom').textContent = t('labelRoom');
    document.getElementById('t-labelGuests').textContent = t('labelGuests');
    document.getElementById('t-labelCheckIn').textContent = t('labelCheckIn');
    document.getElementById('t-labelCheckOut').textContent = t('labelCheckOut');
    document.getElementById('t-hintCheckIn').textContent = t('hintCheckIn');
    document.getElementById('t-hintCheckOut').textContent = t('hintCheckOut');
    document.getElementById('hb-submit-btn').textContent = t('btnSubmit');
    document.getElementById('t-confirmTitle').textContent = t('confirmTitle');
    document.getElementById('t-confirmSub').textContent = t('confirmSub');
    document.getElementById('hb-new-booking-btn').textContent = t('btnNewBooking');
    document.getElementById('t-footerNote').textContent = t('footerNote');
    document.getElementById('t-confirmHowTo').textContent = t('confirmHowTo');
    document.getElementById('t-checkTitle').textContent = t('checkTitle');
    document.getElementById('t-checkSub').textContent = t('checkSub');
    document.getElementById('t-labelRef').textContent = t('labelRef');
    document.getElementById('t-labelContact').textContent = t('labelContact');
    document.getElementById('hb-check-btn').textContent = t('btnCheck');
    document.getElementById('f-guestName').placeholder = lang === 'vi' ? 'vd: Nguyễn Văn A' : 'e.g. Amara Okafor';
    document.getElementById('f-phone').placeholder = lang === 'vi' ? '090 123 4567' : '+1 555 010 2938';
    document.getElementById('f-country').placeholder = lang === 'vi' ? 'Việt Nam' : 'Canada';
    const handleInput = document.getElementById('f-socialHandle');
    const method = document.getElementById('f-socialMethod').value;
    handleInput.placeholder = method ? (method === 'zalo' ? t('zaloPh') : method === 'instagram' ? t('igPh') : t('mePh')) : t('socialHandlePh');
    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    document.getElementById('lang-vi').classList.toggle('active', lang === 'vi');
    renderSyncBanner();
  }

  function setLanguage(newLang) {
    lang = newLang;
    applyStaticText();
    renderRoomChoice();
    updatePreview();
    renderRooms();
  }
  document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
  document.getElementById('lang-vi').addEventListener('click', () => setLanguage('vi'));

  function showError(msg) {
    const el = document.getElementById('hb-error');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideError() { document.getElementById('hb-error').style.display = 'none'; }

  document.getElementById('f-socialMethod').addEventListener('change', (e) => {
    const handleInput = document.getElementById('f-socialHandle');
    const method = e.target.value;
    if (method) { handleInput.disabled = false; handleInput.placeholder = method === 'zalo' ? t('zaloPh') : method === 'instagram' ? t('igPh') : t('mePh'); }
    else { handleInput.disabled = true; handleInput.value = ''; handleInput.placeholder = t('socialHandlePh'); }
  });
  document.getElementById('f-checkIn').addEventListener('change', () => {
    document.getElementById('f-checkOut').min = document.getElementById('f-checkIn').value;
    updatePreview();
  });
  document.getElementById('f-checkOut').addEventListener('change', updatePreview);

  document.getElementById('hb-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const guestName = document.getElementById('f-guestName').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const country = document.getElementById('f-country').value.trim();
    const socialMethod = document.getElementById('f-socialMethod').value;
    const socialHandle = document.getElementById('f-socialHandle').value.trim();
    const guests = Number(document.getElementById('f-guests').value);
    const checkIn = document.getElementById('f-checkIn').value;
    const checkOut = document.getElementById('f-checkOut').value;
    const nights = nightsBetween(checkIn, checkOut);

    if (!guestName) return showError(t('errGuestName'));
    if (!phone && !(socialMethod && socialHandle)) return showError(t('errContact'));
    if (socialMethod && !socialHandle) return showError(t('errSocialHandle'));
    if (!country) return showError(t('errCountry'));
    if (!checkIn || !checkOut) return showError(t('errDates'));
    if (nights <= 0) return showError(t('errNights'));
    if (!guests || guests < 1) return showError(t('errGuests'));

    // Refresh the latest bookings right before checking for a clash, to minimize race conditions.
    await loadBookings();
    const overlap = bookings.some((b) => b.roomKey === selectedRoom && b.status !== 'declined' && rangesOverlap(checkIn, checkOut, b.checkIn, b.checkOut));
    if (overlap) return showError(ROOMS[selectedRoom].name + t('errOverlap'));

    const { discounted, totalUsd, totalVnd } = computePrice(selectedRoom, nights);
    const id = uid();
    const record = {
      id, guestName, phone, country, socialMethod, socialHandle,
      roomKey: selectedRoom, checkIn, checkOut, guests, nights,
      pricePerNight: ROOMS[selectedRoom].price, pricePerNightVND: ROOMS[selectedRoom].priceVND,
      discounted, total: Math.round(totalUsd * 100) / 100, totalVND: Math.round(totalVnd),
      status: 'pending', createdAt: Date.now()
    };

    document.getElementById('hb-submit-btn').disabled = true;
    try {
      await persistUpsert(record);
      showConfirmation(record);
      bookings.push(record);
      renderRooms();
    } catch (err) {
      showError(t('syncError'));
    } finally {
      document.getElementById('hb-submit-btn').disabled = false;
    }
  });

  function showConfirmation(record) {
    const room = ROOMS[record.roomKey];
    const price = dualPrice(record.total, record.totalVND);
    document.getElementById('hb-confirm-card').innerHTML = `
      <div class="hb-confirm-row"><span>${t('confirmRef')}</span><span class="hb-confirm-ref">${record.id.slice(-6).toUpperCase()}</span></div>
      <div class="hb-confirm-row"><span>${t('confirmStatus')}</span><span>${t('confirmPending')}</span></div>
      <div class="hb-confirm-row"><span>${t('confirmName')}</span><span>${escapeHtml(record.guestName)}</span></div>
      <div class="hb-confirm-row"><span>${t('confirmRoom')}</span><span>${room.name}</span></div>
      <div class="hb-confirm-row"><span>${t('confirmStay')}</span><span>${formatDate(record.checkIn)} → ${formatDate(record.checkOut)}</span></div>
      <div class="hb-confirm-row"><span>${t('confirmGuests')}</span><span>${record.guests}</span></div>
      <div class="hb-confirm-row"><span>${t('confirmTotal')}</span><span>${price.primary} (${price.secondary})</span></div>
    `;
    document.getElementById('hb-form').style.display = 'none';
    document.getElementById('hb-confirm').style.display = 'block';
  }

  document.getElementById('hb-new-booking-btn').addEventListener('click', () => {
    document.getElementById('hb-form').reset();
    document.getElementById('f-socialHandle').disabled = true;
    document.getElementById('f-guests').value = 1;
    selectedRoom = 'cozy';
    renderRoomChoice();
    updatePreview();
    hideError();
    document.getElementById('hb-confirm').style.display = 'none';
    document.getElementById('hb-form').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- Check my booking ----------
  const normContact = (s) => String(s == null ? '' : s).toLowerCase().replace(/[\s\-.+()@]/g, '').replace(/^0+/, '');
  document.getElementById('hb-check-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const ref = document.getElementById('c-ref').value.trim().toUpperCase();
    const contact = normContact(document.getElementById('c-contact').value);
    const out = document.getElementById('hb-check-result');
    if (!ref || !contact) { out.innerHTML = `<div class="hb-result notfound">${t('checkNotFound')}</div>`; return; }
    await loadBookings();
    const b = bookings.find((x) => String(x.id).slice(-6).toUpperCase() === ref &&
      (normContact(x.phone) === contact || normContact(x.socialHandle) === contact));
    if (!b) { out.innerHTML = `<div class="hb-result notfound">${t('checkNotFound')}</div>`; return; }
    const msgKey = { pending: 'resPending', upcoming: 'resApproved', 'checked-in': 'resCheckedIn', 'checked-out': 'resCheckedOut', declined: 'resDeclined' }[b.status] || 'resPending';
    out.innerHTML = `<div class="hb-result">
      <div class="hb-result-status">${t(msgKey)}</div>
      <div>${ROOMS[b.roomKey].name} · ${formatDate(b.checkIn)} → ${formatDate(b.checkOut)}</div>
    </div>`;
  });

  // ---------- Init ----------
  applyStaticText();
  renderRoomChoice();
  loadBookings();
  setInterval(loadBookings, AUTO_REFRESH_MS);
</script>
</body>
</html>
